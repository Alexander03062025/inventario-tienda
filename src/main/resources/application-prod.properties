# Perfil de PRODUCCIÓN (se activa con SPRING_PROFILES_ACTIVE=prod).
#
# La conexión a PostgreSQL la arma DatabaseConfig.java a partir de la
# variable de entorno DATABASE_URL que inyecta Render
# (formato: postgresql://usuario:clave@host:puerto/basededatos).

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# La consola H2 no tiene sentido en producción
spring.h2.console.enabled=false
