spring.application.name=inventario-tienda

# El puerto lo fija el hosting (Render usa la variable PORT). En local: 8080.
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Base de datos: por defecto H2 en archivo (desarrollo local).
# En producción se activa el perfil "prod" (application-prod.properties)
# con SPRING_PROFILES_ACTIVE=prod y se usa PostgreSQL.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/inventario;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Consola web de H2 (solo útil en local): http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Seguridad / JWT
# En producción, DEFINIR estas variables de entorno (no dejar los valores por defecto):
#   APP_JWT_SECRET       -> cadena aleatoria de 32+ caracteres
#   APP_ADMIN_USERNAME   -> usuario admin inicial
#   APP_ADMIN_PASSWORD   -> contraseña admin inicial
# ---------------------------------------------------------------------------
app.jwt.secret=${APP_JWT_SECRET:clave-solo-para-desarrollo-local-cambiar-en-produccion-32+}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:28800000}

app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}
app.admin.nombre=${APP_ADMIN_NOMBRE:Administrador}
