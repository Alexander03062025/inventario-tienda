spring.application.name=inventario-tienda

# --- Base de datos H2 en archivo (se crea sola, no hay que instalar nada) ---
spring.datasource.url=jdbc:h2:file:./data/inventario;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Consola web de H2 para inspeccionar la base: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Carga datos de ejemplo despues de crear las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

server.port=8080
